# Configurações do pnpm. Estas chaves ficavam no campo "pnpm" do package.json.

# Quais pacotes podem rodar script de instalação.
allowBuilds:
  # Ferramenta de mock de rede, puxada por transitividade. Não usamos.
  msw: false
  # Baixa o binário nativo que o Next usa para otimizar/redimensionar imagens.
  sharp: true
  # Resolvedor nativo usado pelo eslint-config-next.
  unrs-resolver: true

# Pin herdado do projeto original (gerado pelo v0).
overrides:
  hono: 4.12.25

patchedDependencies:
  next-themes@0.4.6: patches/next-themes@0.4.6.patch
